<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button aria-label="Abrir menú"></ion-menu-button>
    </ion-buttons>
    <ion-title>Mis Gastos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="login-shell">
    <div class="brand-mark" aria-hidden="true">
      <ion-icon name="wallet-outline"></ion-icon>
    </div>
    <h1>Mis Gastos</h1>
    <p class="tagline">Administra tus finanzas personales</p>

    <ion-card class="login-card">
      <ion-card-content>
        <form (ngSubmit)="openDashboard()">
          <ion-input
            label="Correo electrónico"
            labelPlacement="stacked"
            fill="outline"
            type="email"
            name="email"
            autocomplete="email"
            placeholder="correo@ejemplo.com"
            [(ngModel)]="email"
            required>
          </ion-input>

          <ion-input
            class="password-input"
            label="Contraseña"
            labelPlacement="stacked"
            fill="outline"
            type="password"
            name="password"
            autocomplete="current-password"
            placeholder="Tu contraseña"
            [(ngModel)]="password"
            required>
          </ion-input>

          <ion-button class="login-button" expand="block" type="submit">
            Iniciar sesión
          </ion-button>
          <ion-button
            class="guest-button"
            expand="block"
            fill="outline"
            type="button"
            routerLink="/home">
            Continuar sin cuenta
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
    <p class="demo-note">Prototipo local · tus datos no se envían</p>
  </main>
</ion-content>
